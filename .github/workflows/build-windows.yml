# Windows x86_64 build of the kit binaries and qemu-system-sparc64, made
# with machines/release/build-windows.sh (MinGW on Fedora 43 in Docker),
# packed with the firmware and keymaps so that it runs without -L.
name: Build Windows

on:
  push:
    branches: [ci/windows-build]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TARGETS: i386 ppc ppc64 alpha mips64el mips64 hppa sparc m68k sparc64
    steps:
      # full history and tags: build-windows.sh passes
      # "git describe --match 'v*'" as the version, and fails without it
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          filter: blob:none
          persist-credentials: false

      - name: Describe
        id: meta
        run: |
          ver=$(git describe --match 'v*' --dirty)
          short=$(git rev-parse --short=12 HEAD)
          echo "git id: $ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "name=lemu-windows-x86_64-$short" >> "$GITHUB_OUTPUT"
          nproc
          df -h / "$RUNNER_TEMP"
          docker version --format 'docker {{.Server.Version}}'

      # the subprojects (keycodemapdb, softfloat, dtc, slirp) are cloned by
      # configure inside the container; its copy of the tree has no .git,
      # so configure does not turn on werror
      - name: Build
        run: |
          sh machines/release/build-windows.sh . "$RUNNER_TEMP/out" |
              tee "$RUNNER_TEMP/out-check.log"

      - name: Show the build logs
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/out/windows-x86_64-*.log; do
              [ -f "$f" ] || continue
              echo "::group::$f"
              tail -n 100 "$f"
              echo "::endgroup::"
          done

      # QEMU looks for firmware in share/ next to the exe and for keymaps in
      # share/keymaps (relocatable build, bindir '' and qemu_suffix '' from
      # configs/meson/windows.txt), the same layout as the kits
      - name: Pack
        id: pack
        env:
          NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          out=$RUNNER_TEMP/out
          d=$RUNNER_TEMP/dist/$NAME
          mkdir -p "$RUNNER_TEMP/dist"
          # the container wrote OUT as root: copy it to a folder of our own
          cp -R "$out/windows-x86_64" "$d"
          mkdir -p "$d/share/dtb" "$d/logs"

          grep -q '^ *Relocatable install *: YES' "$out/windows-x86_64-configure.log" ||
              { echo "MISSING: relocatable install"; exit 1; }

          # every blob in pc-bios/meson.build except those for targets
          # not built here (arm, s390x, hexagon, riscv) and the installer
          # bitmap; none of the targets needs the .bz2 edk2 images
          blobs=$(sed -n "/^blobs = \[/,/^\]/s/^ *'\([^']*\)',\$/\1/p" pc-bios/meson.build |
              grep -Ev '^(ast27x0_bootrom\.bin|npcm[78]xx_bootrom\.bin|s390-ccw\.img|hexagon.*|opensbi-.*|edk2-licenses\.txt|qemu-nsis\.bmp)$')
          for f in $blobs; do
              cp "pc-bios/$f" "$d/share/"
          done
          # the PowerPC boards' device trees (not the microblaze ones)
          for f in $(sed -n "/^dtbs = \[/,/^\]/s/^ *'\([^']*\)',\$/\1/p" pc-bios/dtb/meson.build |
                  grep -v '^petalogix'); do
              cp "pc-bios/dtb/$f" "$d/share/dtb/"
          done
          cp COPYING COPYING.LIB "$d/"
          cp "$out"/windows-x86_64-*.log "$RUNNER_TEMP/out-check.log" "$d/logs/"

          fail=0
          for t in $TARGETS; do
              [ -s "$d/qemu-system-$t.exe" ] || { echo "MISSING: qemu-system-$t.exe"; fail=1; }
          done
          for f in SDL3.dll openbios-sparc32 openbios-sparc64 'QEMU,tcx.bin' \
                  'QEMU,cgthree.bin' openbios-ppc qemu_vga.ndrv slof.bin vof.bin \
                  vof-nvram.bin skiboot.lid pnv-pnor.bin u-boot.e500 u-boot-sam460.bin \
                  bios.bin bios-256k.bin vgabios.bin vgabios-cirrus.bin \
                  vgabios-stdvga.bin vgabios-vmware.bin kvmvapic.bin linuxboot_dma.bin \
                  multiboot_dma.bin pvh.bin efi-e1000.rom efi-ne2k_pci.rom efi-pcnet.rom \
                  efi-rtl8139.rom pxe-eepro100.rom palcode-clipper hppa-firmware.img \
                  hppa-firmware64.img keymaps/en-us keymaps/de dtb/bamboo.dtb; do
              case $f in
              *.dll) p=$d/$f ;;
              *) p=$d/share/$f ;;
              esac
              [ -s "$p" ] || { echo "MISSING: $p"; fail=1; }
          done
          # a qemu-bundle folder next to the exe would replace share/
          [ ! -e "$d/qemu-bundle" ] || { echo "UNEXPECTED: qemu-bundle"; fail=1; }
          [ $fail = 0 ] || exit 1

          {
          echo "LEMU for Windows x86_64"
          echo
          echo "Built by GitHub Actions from $GITHUB_REPOSITORY, branch $GITHUB_REF_NAME,"
          echo "commit $GITHUB_SHA ($VERSION)."
          echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo
          echo "Binaries (TCG only): $(for t in $TARGETS; do printf 'qemu-system-%s.exe ' "$t"; done)"
          echo "They were built with machines/release/build-windows.sh, as for LEMU's"
          echo "kits: SDL, DirectSound, slirp, VNC, RDP, the HMP monitor and the block"
          echo "formats of the kits."
          echo
          echo "LEMU does not test its Windows build: it is built, but not run."
          echo "The MCP server (-mcp-bridge) works on macOS and Linux only."
          echo
          echo "Keep the folder together: the exes find their DLLs next to them, the"
          echo "firmware in share\\ and the keymaps in share\\keymaps\\, so -L is not"
          echo "needed. openbios-sparc32, openbios-sparc64 and openbios-ppc are LEMU's"
          echo "own builds (machines/openbios). logs\\ holds the build logs."
          echo
          echo "SPARCstation 5 (sun4m), as machines/sun4m/sunos414/run.cmd in a kit:"
          echo
          echo "  qemu-system-sparc.exe -name \"SunOS 4.1.4 SPARC SS-5\" ^"
          echo "   -M SS-5 -m 256 -vga cg3 -g 1280x1024x8 ^"
          echo "   -drive file=sunos414.qcow2,if=scsi,bus=0,unit=0,format=qcow2 ^"
          echo "   -nic user,model=lance -monitor stdio"
          echo
          echo "Ultra 5/10 (sun4u), see machines/sun4u/README.md; the CD on ide.1, a"
          echo "disk on ide.0, the console on the serial port:"
          echo
          echo "  qemu-system-sparc64.exe -name \"NetBSD 11.1 SPARC64 SUN4U\" ^"
          echo "   -M sun4u -m 1024 -nographic ^"
          echo "   -prom-env input-device=ttya -prom-env output-device=ttya ^"
          echo "   -drive file=disk.qcow2,if=none,id=hd,format=qcow2 ^"
          echo "   -device ide-hd,bus=ide.0,unit=0,drive=hd ^"
          echo "   -drive file=NetBSD-11.1-sparc64.iso,if=none,id=cd,media=cdrom,readonly=on,format=raw ^"
          echo "   -device ide-cd,bus=ide.1,unit=0,drive=cd -boot d"
          echo
          echo "SHA-256 of the OpenBIOS images:"
          (cd "$d/share" && sha256sum openbios-sparc32 openbios-sparc64 openbios-ppc)
          } | sed 's/$/\r/' > "$d/README.txt"

          echo "dir=$d" >> "$GITHUB_OUTPUT"
          (cd "$d" && find . -type f | LC_ALL=C sort && du -sh .)

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.name }}
          path: ${{ steps.pack.outputs.dir }}
          if-no-files-found: error

      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.name }}-logs
          path: |
            ${{ runner.temp }}/out/*.log
            ${{ runner.temp }}/out-check.log
          if-no-files-found: ignore
